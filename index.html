
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOOPLY Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090910;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh}
.box{width:90%;max-width:370px;background:#171724;padding:28px;border-radius:20px;text-align:center}
.logo{font-size:35px;font-weight:900;color:#ff3985}
input{width:100%;padding:14px;margin:9px 0;border:1px solid #444;border-radius:10px;background:#252535;color:white}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#ff3985;color:white;font-weight:bold;margin-top:12px;cursor:pointer}
.switch{color:#ff79a9;cursor:pointer;margin-top:18px}
#message{color:#ff9cba}
</style>
</head>
<body>
<div class="box">
 <div class="logo">LOOPLY</div>
 <h2 id="heading">Create Account</h2>
 <div id="signupFields">
  <input id="username" placeholder="Your username">
 </div>
 <input id="email" type="email" placeholder="Email address">
 <input id="password" type="password" placeholder="Password">
 <button onclick="submitForm()" id="submitBtn">Sign Up</button>
 <p class="switch" onclick="toggleMode()" id="switchText">Already have an account? Login</p>
 <p id="message"></p>
</div>
<script>
let loginMode=false;

function toggleMode(){
 loginMode=!loginMode;
 document.getElementById("heading").textContent=loginMode?"Login":"Create Account";
 document.getElementById("submitBtn").textContent=loginMode?"Login":"Sign Up";
 document.getElementById("switchText").textContent=loginMode?"New here? Sign Up":"Already have an account? Login";
 document.getElementById("signupFields").style.display=loginMode?"none":"block";
 document.getElementById("message").textContent="";
}

function submitForm(){
 let email=document.getElementById("email").value.trim();
 let password=document.getElementById("password").value;
 let username=document.getElementById("username").value.trim();
 let message=document.getElementById("message");

 if(!email||!password||(!loginMode&&!username)){
  message.textContent="Please fill all fields!";
  return;
 }

 if(password.length<8){
  message.textContent="Password must be at least 8 characters.";
  return;
 }

 let users=JSON.parse(localStorage.getItem("looplyUsers")||"[]");

 if(loginMode){
  let user=users.find(u=>u.email===email&&u.password===password);
  if(!user){message.textContent="Account not found or password incorrect.";return;}
  localStorage.setItem("looplyCurrent",JSON.stringify(user));
 }else{
  if(users.some(u=>u.email===email)){
   message.textContent="Email already registered!";
   return;
  }
  let user={username,email,password};
  users.push(user);
  localStorage.setItem("looplyUsers",JSON.stringify(users));
  localStorage.setItem("looplyCurrent",JSON.stringify(user));
 }

 document.body.innerHTML="<div style='text-align:center;font-family:Arial;color:white;background:#090910;min-height:100vh;padding:80px 15px'><h1 style='color:#ff3985'>LOOPLY ❤️</h1><h2>Welcome!</h2><p>Your demo account is ready.</p><button onclick='location.reload()' style='padding:13px;background:#ff3985;color:white;border:0;border-radius:10px'>Continue</button></div>";
}
</script>
</body>
</html>
